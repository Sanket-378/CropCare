spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
grok.api.key=${GROK_API_KEY}
weather.api.key=${OPENWEATHER_API_KEY}
flask.crop.url=${FLASK_CROP_URL:https://cropcare-disease.onrender.com/predict_crop}
server.port=${PORT:10000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect